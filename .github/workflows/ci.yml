name: Codec and model audit
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build portable codec
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 2
      - name: Test codec
        run: ctest --test-dir build --output-on-failure
      - name: Test model audit
        run: python3 -m unittest discover -s tests -p 'test_model_audit.py'
      - name: Test API probe validation
        run: python3 -m unittest discover -s tests -p 'test_api_probe.py'
      - name: Test HTP phase trace analysis
        run: python3 -m unittest discover -s tests -p 'test_htp_trace.py'
      - name: Test context-probe validation
        run: python3 -m unittest discover -s tests -p 'test_context_probe.py'
      - name: Test GPU probe validation
        run: python3 -m unittest discover -s tests -p 'test_gpu_probe.py'
      - name: Compile patched graph runtime
        run: |
          git -C third_party/llama.cpp apply ../../patches/llama-exl3.patch
          cmake -S third_party/llama.cpp -B build-runtime -DCMAKE_BUILD_TYPE=Release -DEXL3_ROOT="$PWD" -DGGML_HEXAGON=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_OPENSSL=OFF
          cmake --build build-runtime --target test-exl3-graph trace_runtime context_probe test-hexagon-attention test-api-serialization -j 2
          build-runtime/bin/test-api-serialization
